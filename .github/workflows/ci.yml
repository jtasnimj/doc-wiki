name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/docwiki
      - run: uv run pytest -m "not live"
      - run: uv run python -m docwiki.eval --mode offline
      - run: docker build -t docwiki:ci .
      - name: Container liveness without an API key
        run: |
          docker run -d --name docwiki-ci -p 127.0.0.1:8000:8000 docwiki:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs docwiki-ci
          exit 1
      - if: always()
        run: docker rm -f docwiki-ci || true
