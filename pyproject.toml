[project]
name = "docwiki"
version = "0.1.0"
description = "Document-grounded question answering for PDF and JSON sources"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.26,<1.27",
  "llama-index-core>=0.14,<0.15",
  "llama-index-vector-stores-chroma>=0.5,<0.6",
  "chromadb>=1,<2",
  "openai>=2,<3",
  "tiktoken>=0.9,<1",
  "filelock>=3.17,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docwiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: paid provider calls requiring explicit approval"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

